    <script>
      (function initDeferredKofiWidget() {
        const storedLang = localStorage.getItem("retrasometro_lang") ?? localStorage.getItem("renfe_lang");
        const browserLang = (navigator.language || "").toLowerCase();
        const lang = storedLang === "en" ? "en" : storedLang === "es" ? "es" : browserLang.startsWith("en") ? "en" : "es";
        const buttonText = lang === "en" ? "Support me" : "Apóyame";
        let loaded = false;

        const initWidget = () => {
          if (window.kofiWidgetOverlay && typeof window.kofiWidgetOverlay.draw === "function") {
            window.kofiWidgetOverlay.draw("mrpoiki", {
              type: "floating-chat",
              "floating-chat.position": "left",
              "floating-chat.donateButton.text": buttonText,
              "floating-chat.donateButton.background-color": "#323842",
              "floating-chat.donateButton.text-color": "#fff",
            });
          }
        };

        const loadWidgetScript = () => {
          if (loaded) {
            return;
          }
          loaded = true;
          const script = document.createElement("script");
          script.src = "https://storage.ko-fi.com/cdn/scripts/overlay-widget.js";
          script.async = true;
          script.onload = initWidget;
          document.head.append(script);
        };

        const scheduleLoad = () => {
          if ("requestIdleCallback" in window) {
            window.requestIdleCallback(loadWidgetScript, { timeout: 25000 });
          } else {
            setTimeout(loadWidgetScript, 12000);
          }
        };

        const interactionEvents = ["pointerdown", "keydown", "touchstart"];
        const onInteraction = () => {
          scheduleLoad();
          for (const eventName of interactionEvents) {
            window.removeEventListener(eventName, onInteraction, { capture: true });
          }
        };

        window.addEventListener(
          "load",
          () => {
            for (const eventName of interactionEvents) {
              window.addEventListener(eventName, onInteraction, {
                passive: true,
                once: true,
                capture: true,
              });
            }
            setTimeout(scheduleLoad, 30000);
          },
          { once: true },
        );
      })();
    </script>
