<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Panel interno de métricas operativas V1 para retrasometro."
    />
    <title>retrasometro ops-lab</title>
    <script>
      (function initThemeEarly() {
        const key = "retrasometro_theme_mode";
        let mode = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") {
            mode = stored;
          }
        } catch {
          mode = "system";
        }

        const isDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolved = mode === "system" ? (isDark ? "dark" : "light") : mode;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260416r4" />
    <style>
      .ops-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .ops-table-wrap {
        overflow: auto;
      }

      .ops-table {
        width: 100%;
        border-collapse: collapse;
      }

      .ops-table th,
      .ops-table td {
        border-bottom: 1px solid var(--cds-border-subtle-01);
        padding: 10px;
        text-align: left;
        white-space: nowrap;
      }

      .ops-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .ops-toolbar input {
        min-width: 220px;
      }

      .ops-status {
        font-size: 0.875rem;
        color: var(--cds-text-secondary);
      }

      @media (max-width: 980px) {
        .ops-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container dashboard-page">
      <header class="hero">
        <div class="hero-brand">
          <div class="hero-copy">
            <p class="kicker" id="ops-kicker">retrasometro</p>
            <h1 id="ops-title">Ops Lab</h1>
          </div>
        </div>
        <div class="hero-side">
          <div class="hero-controls">
            <label class="lang-wrap control-field" for="ops-lang-switch">
              <span id="ops-lang-label">Idioma</span>
              <select id="ops-lang-switch" aria-label="Seleccionar idioma">
                <option value="es">ES</option>
                <option value="en">EN</option>
              </select>
            </label>
            <label class="theme-wrap control-field" for="ops-theme-switch">
              <span id="ops-theme-label">Tema</span>
              <select id="ops-theme-switch" aria-label="Seleccionar tema">
                <option id="ops-theme-option-system" value="system">Sistema</option>
                <option id="ops-theme-option-light" value="light">Claro</option>
                <option id="ops-theme-option-dark" value="dark">Oscuro</option>
              </select>
            </label>
            <button class="ghost-btn" type="button" id="ops-back-btn">Inicio</button>
          </div>
          <div class="status-pill" id="ops-status-pill">Cargando...</div>
        </div>
      </header>

      <section class="panel">
        <div class="panel-header wrap">
          <h2 id="ops-summary-title">Resumen operativo</h2>
          <div class="history-controls" id="ops-window-controls">
            <button class="history-btn" data-window="24" type="button">24h</button>
            <button class="history-btn" data-window="168" type="button">7d</button>
            <button class="history-btn" data-window="720" type="button">30d</button>
          </div>
        </div>
        <div class="cards" id="ops-summary-cards"></div>
        <p class="ops-status" id="ops-cache-meta"></p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2 id="ops-confidence-title">Confianza del dato</h2>
        </div>
        <div class="cards" id="ops-confidence-cards"></div>
      </section>

      <section class="ops-grid">
        <article class="panel">
          <div class="panel-header wrap">
            <h2 id="ops-routes-title">Ranking por dirección</h2>
            <div class="ops-toolbar">
              <input
                id="ops-routes-search"
                type="search"
                placeholder="Filtrar por origen/destino"
              />
            </div>
          </div>
          <div class="ops-table-wrap">
            <table class="ops-table">
              <thead>
                <tr>
                  <th id="ops-col-route">Dirección</th>
                  <th id="ops-col-risk">Riesgo P15</th>
                  <th id="ops-col-severity">Severidad p95</th>
                  <th id="ops-col-load">Carga TM60</th>
                </tr>
              </thead>
              <tbody id="ops-routes-body"></tbody>
            </table>
          </div>
        </article>

        <article class="panel">
          <div class="panel-header wrap">
            <h2 id="ops-products-title">Ranking por tipo</h2>
            <div class="ops-toolbar">
              <input id="ops-products-search" type="search" placeholder="Filtrar por tipo" />
            </div>
          </div>
          <div class="ops-table-wrap">
            <table class="ops-table">
              <thead>
                <tr>
                  <th id="ops-col-product">Tipo</th>
                  <th id="ops-col-product-risk">Riesgo P15</th>
                  <th id="ops-col-product-severity">Severidad p95</th>
                  <th id="ops-col-product-load">Carga TM60</th>
                </tr>
              </thead>
              <tbody id="ops-products-body"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="/ops-lab.js?v=20260420r1"></script>
  </body>
</html>
